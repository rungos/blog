<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>看房记录</title>
<style>
  :root{
    --primary:#4f46e5; --primary-dark:#4338ca; --primary-soft:#eef2ff;
    --amber:#f59e0b;
    --ink:#101828; --text:#344054; --muted:#667085; --faint:#98a2b3;
    --bg:#f2f4f7; --surface:#ffffff; --surface2:#f9fafb;
    --line:#eaecf0; --line-soft:#f2f4f7;
    --danger:#d92d20; --danger-soft:#fef3f2;
    --side-bg:#101828; --side-text:#d0d5dd; --side-muted:#98a2b3;
    --shadow-card:0 1px 3px rgba(16,24,40,.06), 0 12px 32px rgba(16,24,40,.06);
    --shadow-pop:0 8px 16px rgba(16,24,40,.08), 0 24px 48px rgba(16,24,40,.14);
    --ring:rgba(79,70,229,.16);
    --radius:20px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(720px 480px at 88% -6%, rgba(79,70,229,.08), rgba(79,70,229,0) 70%),
      radial-gradient(640px 460px at -8% 24%, rgba(245,158,11,.05), rgba(245,158,11,0) 70%),
      var(--bg);
    background-attachment:fixed;
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    font-size:15px; line-height:1.6;
  }
  ::selection{background:rgba(79,70,229,.18)}
  button{font:inherit; cursor:pointer; background:none; border:none; color:inherit}
  input,select,textarea{font:inherit; font-size:15px; color:var(--ink); background:var(--surface); border:1px solid #d0d5dd; border-radius:12px; padding:10px 13px; width:100%; transition:border-color .15s ease, box-shadow .15s ease}
  input:focus,select:focus,textarea:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 4px var(--ring)}
  textarea{resize:vertical; min-height:72px}
  .hidden{display:none !important}
  body.locked{overflow:hidden}
  .num{font-variant-numeric:tabular-nums}

  /* ---------- buttons ---------- */
  .btn{display:inline-flex; align-items:center; justify-content:center; gap:6px; border:1px solid #d0d5dd; background:var(--surface); color:var(--ink); border-radius:999px; padding:9px 18px; font-size:14px; font-weight:600; transition:all .16s ease; white-space:nowrap}
  .btn:hover{border-color:var(--primary); color:var(--primary); box-shadow:0 2px 8px rgba(16,24,40,.08)}
  .btn.primary{background:var(--primary); border-color:var(--primary); color:#fff; box-shadow:0 4px 12px rgba(79,70,229,.28)}
  .btn.primary:hover{background:var(--primary-dark); border-color:var(--primary-dark); color:#fff}
  .btn.danger{color:var(--danger)}
  .btn.danger:hover{border-color:var(--danger); color:var(--danger); background:var(--danger-soft); box-shadow:none}
  .btn.small{padding:6px 14px; font-size:13px}
  .btn.block{width:100%; padding:13px; font-size:16px}
  .btn:disabled{opacity:.55; cursor:default; box-shadow:none}
  .err{color:var(--danger); font-size:13px; min-height:18px; margin-top:10px}
  .hint{font-size:12px; color:var(--muted); margin-top:14px; word-break:break-all}

  /* ---------- login ---------- */
  #view-login{min-height:100dvh; display:flex}
  .login-brand{flex:1.05; position:relative; overflow:hidden; display:flex; flex-direction:column; justify-content:center; padding:64px 72px; color:#fff;
    background:linear-gradient(135deg,#312e81 0%, #4f46e5 52%, #7c3aed 100%)}
  .login-brand::before,.login-brand::after{content:""; position:absolute; border:1.5px solid rgba(255,255,255,.20); border-radius:50%}
  .login-brand::before{width:480px; height:480px; right:-140px; top:-140px}
  .login-brand::after{width:300px; height:300px; right:-40px; top:-40px; border-color:rgba(255,255,255,.13)}
  .login-brand .ring3{position:absolute; width:560px; height:560px; left:-220px; bottom:-280px; border:1.5px solid rgba(255,255,255,.10); border-radius:50%}
  .login-logo{display:flex; align-items:center; gap:12px; position:relative; z-index:1}
  .logo-mark{width:42px; height:42px; border-radius:13px; background:#fff; color:var(--primary); display:flex; align-items:center; justify-content:center; font-size:21px; font-weight:800; box-shadow:0 6px 16px rgba(16,24,40,.25)}
  .login-brand h1{font-size:52px; font-weight:800; letter-spacing:-.01em; margin:38px 0 10px; position:relative; z-index:1}
  .login-brand p{font-size:17px; color:rgba(255,255,255,.82); margin:0; position:relative; z-index:1}
  .login-form-side{flex:1; display:flex; align-items:center; justify-content:center; padding:32px 24px; background:var(--surface)}
  .login-box{width:100%; max-width:380px}
  .login-box h2{font-size:26px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:0 0 6px}
  .login-box .sub{color:var(--muted); font-size:14px; margin:0 0 8px}
  .login-box label{display:block; font-size:13px; font-weight:600; color:var(--ink); margin:18px 0 7px}
  @media (max-width:860px){ .login-brand{display:none} }

  /* ---------- app shell ---------- */
  #view-app{display:flex; min-height:100dvh}
  #sidebar{width:260px; flex:none; background:var(--side-bg); color:var(--side-text); position:sticky; top:0; height:100dvh; display:flex; flex-direction:column; padding:22px 16px 18px; z-index:60}
  .side-logo{display:flex; align-items:center; gap:11px; padding:2px 8px 20px}
  .side-logo .logo-mark{width:36px; height:36px; border-radius:11px; font-size:18px; background:var(--primary); color:#fff; box-shadow:none}
  .side-logo span{font-size:17px; font-weight:800; color:#fff; letter-spacing:.01em}
  .side-nav{display:flex; flex-direction:column; gap:4px}
  .nav-item{display:flex; align-items:center; gap:10px; padding:10px 12px; border-radius:12px; color:var(--side-text); font-size:14.5px; font-weight:500; text-align:left; transition:all .16s ease; width:100%}
  .nav-item:hover{background:rgba(255,255,255,.06); color:#fff}
  .nav-item.active{background:var(--primary); color:#fff; box-shadow:0 6px 14px rgba(79,70,229,.35)}
  .nav-item .cnt{margin-left:auto; font-size:12px; font-weight:700; background:rgba(255,255,255,.14); color:#fff; border-radius:999px; padding:1px 8px; font-variant-numeric:tabular-nums}
  .nav-item.active .cnt{background:rgba(255,255,255,.22)}
  .side-sec-title{font-size:11.5px; font-weight:700; letter-spacing:.10em; color:var(--side-muted); margin:24px 8px 10px}
  .side-filters{display:flex; flex-direction:column; gap:10px}
  .side-filters label{font-size:12px; color:var(--side-muted); display:block; margin:0 0 4px 2px}
  .side-filters select{background:#1d2939; border-color:#344054; color:#f2f4f7}
  .side-filters select:focus{border-color:var(--primary); box-shadow:0 0 0 4px rgba(79,70,229,.30)}
  .side-spacer{flex:1}
  .side-import{width:100%; justify-content:flex-start; background:rgba(255,255,255,.05); border-color:#344054; color:var(--side-text)}
  .side-import:hover{background:rgba(255,255,255,.10); color:#fff; border-color:#475467; box-shadow:none}
  .side-user{margin-top:14px; padding:13px 12px 2px; border-top:1px solid #1d2939; display:flex; align-items:center; gap:10px}
  .avatar{width:34px; height:34px; border-radius:50%; background:linear-gradient(135deg,#6366f1,#a855f7); color:#fff; display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700; flex:none}
  .side-user .mail{flex:1; font-size:12.5px; color:var(--side-text); word-break:break-all; line-height:1.35}
  .logout-btn{color:var(--side-muted); font-size:13px; padding:6px 8px; border-radius:8px; flex:none}
  .logout-btn:hover{color:#fff; background:rgba(255,255,255,.08)}
  #side-backdrop{display:none}

  .main-wrap{flex:1; min-width:0; padding:28px 34px 120px; max-width:1460px; margin:0 auto; width:100%}
  .topbar-mobile{display:none}
  .page-head{display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap}
  .page-head .titles{flex:1; min-width:200px}
  .page-head h1{font-size:30px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:0}
  .page-head .subline{color:var(--muted); font-size:13.5px; margin-top:3px; font-variant-numeric:tabular-nums}
  .search-box{position:relative; width:320px; max-width:100%}
  .search-box input{border-radius:999px; padding:11px 16px 11px 40px; background:var(--surface); border-color:var(--line); box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .search-box input:focus{border-color:var(--primary)}
  .search-box .ic{position:absolute; left:15px; top:50%; transform:translateY(-50%); color:var(--faint); font-size:15px; pointer-events:none}
  .mobile-chips{display:none}
  .filter-summary{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-top:16px; font-size:13px; color:var(--muted)}
  .filter-summary .chip-x{background:var(--primary-soft); color:var(--primary); border-radius:999px; padding:3px 10px; font-weight:600}
  .filter-summary button{color:var(--primary); font-weight:600; font-size:13px; padding:2px 4px}

  /* ---------- stats ---------- */
  .stats{display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-top:24px}
  .stat{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); padding:18px 20px; box-shadow:var(--shadow-card)}
  .stat .v{font-size:28px; font-weight:800; color:var(--ink); line-height:1.15; font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .stat .l{font-size:13px; color:var(--muted); margin-top:2px}
  .stat .dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px}

  /* ---------- groups & cards ---------- */
  .group{margin-top:30px}
  .group-head{display:flex; align-items:baseline; gap:10px; width:100%; text-align:left; padding:4px 2px 12px; color:var(--ink)}
  .group-head .t{font-size:20px; font-weight:800; letter-spacing:-.01em}
  .group-head .cnt{font-size:13px; font-weight:700; color:var(--primary)}
  .group-head .chev{margin-left:auto; color:var(--faint); font-size:14px; transition:transform .18s ease}
  .group-head.closed .chev{transform:rotate(-90deg)}
  .grid{display:grid; grid-template-columns:repeat(3,1fr); gap:18px}
  .hcard{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); overflow:hidden; box-shadow:var(--shadow-card); cursor:pointer; transition:transform .18s ease, box-shadow .18s ease; display:flex; flex-direction:column}
  .hcard:hover{transform:translateY(-3px); box-shadow:0 4px 8px rgba(16,24,40,.06), 0 20px 40px rgba(16,24,40,.10)}
  .band{height:64px; position:relative; flex:none}
  .band .band-char{position:absolute; left:16px; bottom:-8px; font-size:46px; font-weight:800; color:rgba(255,255,255,.38); line-height:1; letter-spacing:0}
  .band .fav-btn{position:absolute; right:12px; top:12px; width:34px; height:34px; border-radius:50%; background:rgba(255,255,255,.92); color:#c3cad4; font-size:16px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(16,24,40,.16); transition:all .15s ease}
  .band .fav-btn:hover{transform:scale(1.08)}
  .band .fav-btn.on{color:var(--amber)}
  .g0{background:linear-gradient(120deg,#818cf8,#a78bfa)} .g1{background:linear-gradient(120deg,#a78bfa,#f0abfc)}
  .g2{background:linear-gradient(120deg,#38bdf8,#818cf8)} .g3{background:linear-gradient(120deg,#34d399,#2dd4bf)}
  .g4{background:linear-gradient(120deg,#fbbf24,#fb923c)} .g5{background:linear-gradient(120deg,#fda4af,#f472b6)}
  .hcard-body{padding:16px 18px 14px; display:flex; flex-direction:column; flex:1}
  .hcard h3{margin:0; font-size:17px; font-weight:800; color:var(--ink); letter-spacing:-.01em; line-height:1.35}
  .hc-loc{color:var(--muted); font-size:13px; margin-top:3px}
  .hc-price{margin-top:10px; display:flex; align-items:baseline; gap:5px; flex-wrap:wrap}
  .hc-price .pnum{font-size:22px; font-weight:800; color:var(--ink); font-variant-numeric:tabular-nums; letter-spacing:-.01em}
  .hc-price .punit{font-size:12.5px; color:var(--muted)}
  .hc-price .hist{font-size:12.5px; color:var(--faint); margin-left:2px}
  .hc-total{font-size:13px; color:var(--text); margin-top:2px}
  .hc-chips{display:flex; flex-wrap:wrap; gap:6px; margin-top:11px}
  .chip{font-size:12px; line-height:1.5; padding:2.5px 9px; border-radius:999px; background:var(--surface2); border:1px solid var(--line); color:var(--text)}
  .hc-brief{font-size:12.5px; color:var(--muted); margin-top:9px; font-variant-numeric:tabular-nums}
  .hc-foot{display:flex; align-items:center; gap:9px; margin-top:auto; padding-top:13px; border-top:1px solid var(--line-soft); font-size:12.5px; color:var(--muted)}
  .pill{font-size:12px; font-weight:700; line-height:1.5; padding:2.5px 10px; border-radius:999px; background:#eaecf0; color:var(--muted)}
  .pill.viewed{background:var(--primary); color:#fff}
  .stars{color:var(--amber); letter-spacing:1.5px; font-size:12.5px}
  .hc-foot label{display:flex; align-items:center; gap:5px; cursor:pointer; margin-left:auto; font-weight:500}
  .hc-foot input{width:16px; height:16px; padding:0; accent-color:var(--primary); cursor:pointer}
  .empty{grid-column:1 / -1; text-align:center; padding:70px 0; color:var(--muted)}
  .empty .big{font-size:40px; color:#d0d5dd; display:block; margin-bottom:8px}

  /* ---------- compare bar ---------- */
  #compare-bar{position:fixed; left:50%; transform:translateX(-50%); bottom:22px; z-index:55; background:var(--ink); color:#fff; border-radius:999px; padding:9px 10px 9px 20px; display:flex; align-items:center; gap:12px; box-shadow:0 16px 36px rgba(16,24,40,.30); max-width:calc(100vw - 32px)}
  #compare-bar span{font-size:13.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  #compare-bar .btn{border:none}
  #compare-bar .btn.ghosty{background:rgba(255,255,255,.14); color:#fff}
  #compare-bar .btn.ghosty:hover{background:rgba(255,255,255,.24); color:#fff; box-shadow:none}
  .fab{display:none}

  /* ---------- drawer (detail) ---------- */
  .scrim{position:fixed; inset:0; background:rgba(16,24,40,.44); backdrop-filter:blur(2px); opacity:0; pointer-events:none; transition:opacity .22s ease; z-index:70}
  .scrim.show{opacity:1; pointer-events:auto}
  #drawer{position:fixed; top:0; right:0; height:100dvh; width:560px; max-width:100vw; background:var(--bg); z-index:80; transform:translateX(102%); transition:transform .24s cubic-bezier(.32,.72,.28,1); display:flex; flex-direction:column; box-shadow:-16px 0 48px rgba(16,24,40,.18)}
  #drawer.open{transform:translateX(0)}
  .drawer-scroll{flex:1; overflow-y:auto; padding-bottom:18px}
  .drawer-band{height:132px; position:relative; flex:none}
  .drawer-band .band-char{position:absolute; left:22px; bottom:-6px; font-size:84px; font-weight:800; color:rgba(255,255,255,.32); line-height:1}
  .drawer-close{position:absolute; right:16px; top:16px; width:36px; height:36px; border-radius:50%; background:rgba(255,255,255,.92); color:var(--ink); font-size:15px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 8px rgba(16,24,40,.18)}
  .drawer-head{padding:18px 24px 0}
  .drawer-head h2{font-size:24px; font-weight:800; color:var(--ink); letter-spacing:-.01em; margin:0; line-height:1.3}
  .drawer-head .meta-line{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-top:9px; font-size:13px; color:var(--muted)}
  .drawer-body{padding:16px 24px 0}
  .dsec{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-bottom:12px; box-shadow:0 1px 3px rgba(16,24,40,.04)}
  .dsec h4{margin:0 0 8px; font-size:13px; font-weight:800; color:var(--ink); letter-spacing:.04em}
  .dsec h4::before{content:""; display:inline-block; width:7px; height:7px; border-radius:2.5px; background:var(--primary); margin-right:8px; vertical-align:1px}
  .kv{display:flex; padding:6.5px 0; border-bottom:1px solid var(--line-soft); font-size:14px; line-height:1.6}
  .kv:last-child{border-bottom:none}
  .kv .k{width:118px; flex:none; color:var(--muted); font-size:13px}
  .kv .v{flex:1; white-space:pre-wrap; word-break:break-word; color:var(--text); font-variant-numeric:tabular-nums}
  .kv .v a{color:var(--primary); text-decoration:none}
  .kv .v a:hover{text-decoration:underline}
  .amen{padding:4px 0; font-size:14px; color:var(--text)}
  .amen .d{color:var(--muted); font-size:13px}
  .notes-txt{white-space:pre-wrap; word-break:break-word; font-size:14px; color:var(--text)}
  .notes-txt a{color:var(--primary); text-decoration:none}
  .drawer-actions{flex:none; display:flex; gap:9px; padding:14px 24px calc(14px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}
  .drawer-actions .btn{flex:1}

  /* ---------- modal (edit / compare) ---------- */
  .modal-wrap{position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:22px}
  .modal-scrim{position:absolute; inset:0; background:rgba(16,24,40,.44); backdrop-filter:blur(2px)}
  .modal{background:var(--bg); border-radius:22px; box-shadow:var(--shadow-pop); position:relative; width:880px; max-width:100%; max-height:calc(100dvh - 44px); display:flex; flex-direction:column; overflow:hidden; animation:pop .22s cubic-bezier(.32,.72,.28,1)}
  @keyframes pop{from{opacity:0; transform:translateY(10px) scale(.985)} to{opacity:1; transform:none}}
  .modal-head{display:flex; align-items:center; gap:10px; padding:19px 24px 13px}
  .modal-head h2{font-size:19px; font-weight:800; color:var(--ink); margin:0; flex:1; letter-spacing:-.01em}
  .modal-close{width:34px; height:34px; border-radius:50%; background:var(--surface); border:1px solid var(--line); color:var(--muted); font-size:14px; display:flex; align-items:center; justify-content:center; flex:none}
  .modal-close:hover{color:var(--ink); border-color:#d0d5dd}
  .modal-body{overflow-y:auto; padding:2px 24px 8px}
  .modal-foot{display:flex; gap:10px; padding:14px 24px calc(14px + env(safe-area-inset-bottom)); background:var(--surface); border-top:1px solid var(--line)}
  .modal-foot .btn{flex:1; padding:12px}
  form .fsec{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:16px 18px 8px; margin-bottom:12px}
  form .fsec h4{margin:0 0 12px; font-size:13px; font-weight:800; color:var(--ink); letter-spacing:.04em}
  form .fsec h4::before{content:""; display:inline-block; width:7px; height:7px; border-radius:2.5px; background:var(--primary); margin-right:8px; vertical-align:1px}
  form .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:2px 16px}
  form .fld{margin-bottom:11px}
  form .fld.full{grid-column:1 / -1}
  form label{display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin:0 0 5px}
  .arr-row{display:grid; grid-template-columns:1.4fr .7fr 1fr auto; gap:6px; margin-bottom:6px; align-items:center}
  .arr-row input{padding:8px 10px}
  .arr-del{border:1px solid var(--line); background:var(--surface); border-radius:10px; padding:7px 10px; color:var(--danger)}
  .arr-del:hover{border-color:var(--danger); background:var(--danger-soft)}
  .rate-pick{display:flex; gap:6px}
  .rate-pick button{flex:1; padding:9px 0; border-radius:10px; border:1px solid #d0d5dd; background:var(--surface); color:var(--muted); font-weight:600}
  .rate-pick button.on{background:#fffbeb; color:var(--ink); border-color:var(--amber)}
  .cmp-scroll{overflow:auto}
  table.cmp{width:100%; border-collapse:collapse; font-size:13.5px; background:var(--surface); font-variant-numeric:tabular-nums}
  table.cmp th, table.cmp td{border-bottom:1px solid var(--line-soft); padding:10px 12px; text-align:left; vertical-align:top; word-break:break-word}
  table.cmp thead th{font-size:15px; font-weight:800; color:var(--ink); border-bottom:1px solid var(--line); position:sticky; top:0; background:var(--surface)}
  table.cmp td.k{color:var(--muted); width:92px; background:var(--surface2); font-size:12.5px; font-weight:600; white-space:nowrap}
  table.cmp td.best{color:var(--primary); font-weight:800}

  #toast{position:fixed; left:50%; transform:translateX(-50%); bottom:92px; z-index:120; background:var(--ink); color:#fff; padding:10px 20px; border-radius:999px; font-size:13.5px; opacity:0; pointer-events:none; transition:opacity .25s; max-width:88vw; text-align:center; box-shadow:0 10px 26px rgba(16,24,40,.25)}
  #toast.show{opacity:.97}

  /* ---------- responsive ---------- */
  @media (max-width:1240px){ .grid{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:1099px){
    .main-wrap{padding:22px 20px 120px}
    .stats{grid-template-columns:repeat(2,1fr)}
  }
  @media (max-width:767px){
    #sidebar{position:fixed; left:0; top:0; transform:translateX(-104%); transition:transform .24s cubic-bezier(.32,.72,.28,1); box-shadow:16px 0 48px rgba(16,24,40,.25)}
    #sidebar.open{transform:translateX(0)}
    #side-backdrop{display:block; position:fixed; inset:0; background:rgba(16,24,40,.44); opacity:0; pointer-events:none; transition:opacity .22s; z-index:59}
    #side-backdrop.show{opacity:1; pointer-events:auto}

<!-- supabase-js v2 · UMD 构建，挂载全局 supabase.createClient -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";
/* ==================== 配置（部署时改这两行） ==================== */
const SUPABASE_URL = "https://wepbobkwpcxbgorsiqwx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_ql7de3Phcu-6kKukB5vj5w_8oSIh9MC";

//__PURE_START__
/* ==================== 纯工具（无 DOM 依赖） ==================== */
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const isSet = v => v !== null && v !== undefined && v !== "";
const fmtNum = v => isSet(v) ? Number(v).toLocaleString("zh-CN") : "";
function linkify(text){
  return esc(text).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
}
function starsStr(r){ return r ? "★★★★★".slice(0,r) + "☆☆☆☆☆".slice(0,5-r) : ""; }
function priceStr(h){
  if (isSet(h.unitPriceMin) && isSet(h.unitPriceMax))
    return h.unitPriceMin === h.unitPriceMax ? fmtNum(h.unitPriceMin)+" 元/㎡" : fmtNum(h.unitPriceMin)+"–"+fmtNum(h.unitPriceMax)+" 元/㎡";
  if (isSet(h.unitPriceMin)) return fmtNum(h.unitPriceMin)+" 元/㎡起";
  return "";
}
function priceNumStr(h){
  if (isSet(h.unitPriceMin) && isSet(h.unitPriceMax))
    return h.unitPriceMin === h.unitPriceMax ? fmtNum(h.unitPriceMin) : fmtNum(h.unitPriceMin)+"–"+fmtNum(h.unitPriceMax);
  if (isSet(h.unitPriceMin)) return fmtNum(h.unitPriceMin);
  return "";
}
function triStr(v){ return v===1||v===true ? "有" : (v===0||v===false ? "无" : ""); }
function gradIdx(name){
  const s = String(name||""); let n = 0;
  for (let i = 0; i < s.length; i++) n = (n * 31 + s.charCodeAt(i)) >>> 0;
  return n % 6;
}
function groupKey(h){ return [h.city||"未填城市", h.district||"未填区", h.sector||""].join(" › "); }
function groupHouses(list){
  const groups = new Map();
  for (const h of list) {
    const key = groupKey(h);
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push(h);
  }
  return [...groups.entries()];
}
function sortHouses(list, sort){
  const key = { unitPrice: h => isSet(h.unitPriceMin) ? h.unitPriceMin : Infinity,
                rating: h => -(h.rating||0),
                builtYear: h => -(h.builtYear||0) }[sort];
  if (!key) return list;
  return list.slice().sort((a,b) => key(a)-key(b));
}
//__PURE_END__

/* ==================== DOM 工具 / 状态 ==================== */
const $ = s => document.querySelector(s);
function toast(msg){ const t=$("#toast"); t.textContent=msg; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); }

let sb = null;
if (SUPABASE_URL.startsWith("http") && !SUPABASE_ANON_KEY.includes("PASTE")) {
  sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
} else {
  $("#config-hint").classList.remove("hidden");
}

let houses = [];
let curTab = "all";
let collapsed = new Set();
let compareSet = new Set();
let detailId = null;
let editingId = null;
let userEmail = "";

/* ==================== 认证 ==================== */
async function init(){
  if (!sb) return;
  const { data } = await sb.auth.getSession();
  if (data.session) { userEmail = data.session.user?.email || ""; enterApp(); }
  sb.auth.onAuthStateChange((_e, session) => { if (!session) showLogin(); });
}
function showLogin(){
  $("#view-login").classList.remove("hidden");
  $("#view-app").classList.add("hidden");
  closeDrawer(); closeEdit(); closeCompare();
}
function enterApp(){
  $("#view-login").classList.add("hidden");
  $("#view-app").classList.remove("hidden");
  if (userEmail) {
    $("#user-mail").textContent = userEmail;
    $("#user-avatar").textContent = userEmail.trim().charAt(0).toUpperCase() || "·";
  }
  loadHouses();
}
$("#login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!sb) { $("#login-err").textContent = "尚未配置 Supabase，无法登录。"; return; }
  $("#login-btn").disabled = true; $("#login-err").textContent = "";
  const { data, error } = await sb.auth.signInWithPassword({
    email: $("#login-email").value.trim(),
    password: $("#login-pass").value
  });
  $("#login-btn").disabled = false;
  if (error) { $("#login-err").textContent = "登录失败：" + error.message; return; }
  userEmail = data.user?.email || $("#login-email").value.trim();
  enterApp();
});
async function doLogout(){ if (sb) await sb.auth.signOut(); houses = []; showLogin(); }
$("#btn-logout").addEventListener("click", doLogout);
$("#btn-m-logout").addEventListener("click", doLogout);

/* ==================== 数据层（CRUD 按 app_id 匹配） ==================== */
async function loadHouses(){
  const { data, error } = await sb.from("houses").select("data").order("app_id", { ascending: true });
  if (error) { toast("读取失败：" + error.message); return; }
  houses = (data || []).map(r => r.data);
  buildFilterOptions(); renderAll();
}
async function dbInsert(record){
  const { error } = await sb.from("houses").insert({ data: record });
  if (error) throw error;
}
async function dbUpdate(record){
  const { error } = await sb.from("houses").update({ data: record }).eq("app_id", record.id);
  if (error) throw error;
}
async function dbDelete(id){
  const { error } = await sb.from("houses").delete().eq("app_id", id);
  if (error) throw error;
}
function byId(id){ return houses.find(h => h.id === id); }

/* ==================== 筛选 ==================== */
function uniqSorted(vals){ return [...new Set(vals.filter(isSet))]; }
function fillSelect(sel, vals, allLabel, keep){
  const cur = keep ? sel.value : "";
  sel.innerHTML = `<option value="">${allLabel}</option>` + vals.map(v => `<option ${v===cur?"selected":""}>${esc(v)}</option>`).join("");
}
function buildFilterOptions(){
  fillSelect($("#f-city"), uniqSorted(houses.map(h=>h.city)), "全部城市", true);
  buildDistrictOptions();
}
function buildDistrictOptions(){
  const city = $("#f-city").value;
  const pool = city ? houses.filter(h=>h.city===city) : houses;
  fillSelect($("#f-district"), uniqSorted(pool.map(h=>h.district)), "全部区", true);
  buildSectorOptions();
}
function buildSectorOptions(){
  const city = $("#f-city").value, dist = $("#f-district").value;
  let pool = houses;
  if (city) pool = pool.filter(h=>h.city===city);
  if (dist) pool = pool.filter(h=>h.district===dist);
  fillSelect($("#f-sector"), uniqSorted(pool.map(h=>h.sector)), "全部板块", true);
}
$("#f-city").addEventListener("change", () => { buildDistrictOptions(); renderList(); });
$("#f-district").addEventListener("change", () => { buildSectorOptions(); renderList(); });
$("#f-sector").addEventListener("change", renderList);
$("#f-sort").addEventListener("change", renderList);
$("#search").addEventListener("input", renderList);
function activeFilters(){
  const f = { city: $("#f-city").value, district: $("#f-district").value, sector: $("#f-sector").value,
              sort: $("#f-sort").value, q: $("#search").value.trim() };
  f.any = !!(f.city || f.district || f.sector || f.q || f.sort !== "default");
  return f;
}
function clearFilters(){
  $("#f-city").value = ""; buildDistrictOptions();
  $("#f-sort").value = "default"; $("#search").value = "";
  renderList();
}
function renderFilterSummary(){
  const f = activeFilters();
  const box = $("#filter-summary");
  if (!f.any) { box.classList.add("hidden"); box.innerHTML = ""; return; }
  const parts = [];
  if (f.city) parts.push(f.city);
  if (f.district) parts.push(f.district);
  if (f.sector) parts.push(f.sector);
  if (f.q) parts.push("搜索「" + f.q + "」");
  if (f.sort !== "default") parts.push("已排序");
  box.innerHTML = `<span>当前筛选</span>` + parts.map(p => `<span class="chip-x">${esc(p)}</span>`).join("") + `<button id="fs-clear">清除全部</button>`;
  box.classList.remove("hidden");
  $("#fs-clear").addEventListener("click", clearFilters);
}

/* ==================== 页签 ==================== */
function setTab(tab){
  curTab = tab;
  document.querySelectorAll("#side-nav .nav-item").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll("#mobile-chips .mchip").forEach(b => b.classList.toggle("active", b.dataset.tab === tab));
  renderList();
}
$("#side-nav").addEventListener("click", e => {
  const b = e.target.closest(".nav-item"); if (!b) return;
  setTab(b.dataset.tab); closeSidebarMobile();
});
$("#mobile-chips").addEventListener("click", e => {
  const b = e.target.closest(".mchip"); if (!b) return;
  setTab(b.dataset.tab);
});
function openSidebarMobile(){ $("#sidebar").classList.add("open"); $("#side-backdrop").classList.add("show"); }
function closeSidebarMobile(){ $("#sidebar").classList.remove("open"); $("#side-backdrop").classList.remove("show"); }
$("#btn-m-filter").addEventListener("click", openSidebarMobile);
$("#side-backdrop").addEventListener("click", closeSidebarMobile);

/* ==================== 统计 ==================== */
function renderStats(){
  const total = houses.length;
  const viewed = houses.filter(h=>h.status==="viewed").length;
  const planned = houses.filter(h=>h.status==="planned").length;
  const fav = houses.filter(h=>h.isFavorite).length;
  $("#stats").innerHTML = [
    [total, "总套数", "#4f46e5"], [viewed, "已看", "#0e9384"], [planned, "待看", "#98a2b3"], [fav, "收藏", "#f59e0b"]
  ].map(([v,l,c]) => `<div class="stat"><div class="v num">${v}</div><div class="l"><span class="dot" style="background:${c}"></span>${l}</div></div>`).join("");
  $("#subline").textContent = `共 ${total} 套 · 已看 ${viewed} · 待看 ${planned} · 收藏 ${fav}`;
  document.querySelectorAll("[data-cnt]").forEach(el => {
    el.textContent = { all: total, viewed, planned, fav }[el.dataset.cnt] ?? "";
  });
}

/* ==================== 列表渲染 ==================== */
function filteredHouses(){
  let list = houses.slice();
  if (curTab === "viewed") list = list.filter(h=>h.status==="viewed");
  if (curTab === "planned") list = list.filter(h=>h.status==="planned");
  if (curTab === "fav") list = list.filter(h=>h.isFavorite);
  const f = activeFilters();
  if (f.city) list = list.filter(h=>h.city===f.city);
  if (f.district) list = list.filter(h=>h.district===f.district);
  if (f.sector) list = list.filter(h=>h.sector===f.sector);
  if (f.q) list = list.filter(h => (h.community||"").includes(f.q) || (h.notes||"").includes(f.q) || (h.district||"").includes(f.q) || (h.sector||"").includes(f.q));
  return list;
}
function cardHTML(h, showLoc){
  const name = h.community || "（未命名）";
  const chips = [];
  if (isSet(h.builtYear)) chips.push(`建成 ${h.builtYear}`);
  if (triStr(h.hasElevator)) chips.push(triStr(h.hasElevator) === "有" ? "有电梯" : "无电梯");
  if (isSet(h.totalFloors)) chips.push(`${h.totalFloors} 层`);
  if (isSet(h.layout)) chips.push(h.layout);
  if (isSet(h.areaSqm)) chips.push(`${h.areaSqm} ㎡`);
  const brief = [];
  if (isSet(h.subwayKm)) brief.push("地铁 "+h.subwayKm+"km");
  if (isSet(h.commuteAMinutes)) brief.push("通勤A "+h.commuteAMinutes+"分钟");
  if (isSet(h.commuteBMinutes)) brief.push("通勤B "+h.commuteBMinutes+"分钟");
  const first = name.trim().charAt(0) || "房";
  return `<article class="hcard" data-id="${h.id}">
    <div class="band g${gradIdx(h.community)}">
      <span class="band-char">${esc(first)}</span>
      <button class="fav-btn ${h.isFavorite?"on":""}" data-act="fav" title="收藏">★</button>
    </div>
    <div class="hcard-body">
      <h3>${esc(name)}</h3>
      ${showLoc ? `<div class="hc-loc">${esc([h.city, h.district, h.sector].filter(isSet).join(" · "))}</div>` : ""}
      ${priceNumStr(h) ? `<div class="hc-price"><span class="pnum">${esc(priceNumStr(h))}</span><span class="punit">元/㎡</span>${(isSet(h.histPriceMin)||isSet(h.histPriceMax)) ? `<span class="hist">历史 ${fmtNum(h.histPriceMin)}–${fmtNum(h.histPriceMax)}</span>` : ""}</div>` : ""}
      ${isSet(h.totalPriceNote) ? `<div class="hc-total">${esc(h.totalPriceNote)}</div>` : ""}
      ${chips.length ? `<div class="hc-chips">${chips.map(c=>`<span class="chip">${esc(c)}</span>`).join("")}</div>` : ""}
      ${brief.length ? `<div class="hc-brief">${esc(brief.join(" · "))}</div>` : ""}
      <div class="hc-foot">
        <span class="pill ${h.status==="viewed"?"viewed":""}">${h.status==="viewed"?"已看":"待看"}</span>
        ${h.rating ? `<span class="stars">${starsStr(h.rating)}</span>` : ""}
        ${h.viewingDate ? `<span>${esc(h.viewingDate)}</span>` : ""}
        <label><input type="checkbox" data-act="cmp" ${compareSet.has(h.id)?"checked":""}>对比</label>
      </div>
    </div>
  </article>`;
}
function renderAll(){ renderStats(); renderList(); }
function renderList(){
  renderFilterSummary();
  const f = activeFilters();
  const list = filteredHouses();
  const main = $("#list-main");
  if (!list.length) {
    main.innerHTML = `<div class="group"><div class="grid"><div class="empty"><span class="big">⌂</span>没有符合条件的记录</div></div></div>`;
    updateCompareBar(); return;
  }
  if (f.any) {
    const items = f.sort !== "default" ? sortHouses(list, f.sort) : list;
    main.innerHTML = `<div class="group"><div class="grid">${items.map(h => cardHTML(h, true)).join("")}</div></div>`;
  } else {
    main.innerHTML = groupHouses(list).map(([key, items]) => {
      const isCol = collapsed.has(key);
      return `<section class="group">
        <button class="group-head ${isCol?"closed":""}" data-group="${esc(key)}"><span class="t">${esc(key)}</span><span class="cnt">${items.length} 套</span><span class="chev">▾</span></button>
        ${isCol ? "" : `<div class="grid">${items.map(h=>cardHTML(h,false)).join("")}</div>`}
      </section>`;
    }).join("");
  }
  updateCompareBar();
}
$("#list-main").addEventListener("click", async e => {
  const gh = e.target.closest(".group-head");
  if (gh) { const k = gh.dataset.group; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderList(); return; }
  const card = e.target.closest(".hcard"); if (!card) return;
  const id = Number(card.dataset.id);
  const actEl = e.target.closest("[data-act]");
  const act = actEl ? actEl.dataset.act : null;
  if (act === "fav") {
    const h = byId(id); if (!h) return;
    h.isFavorite = !h.isFavorite;
    try { await dbUpdate(h); renderStats(); renderList(); if (detailId === id) syncDrawerActions(h); toast(h.isFavorite ? "已收藏" : "已取消收藏"); }
    catch(err){ h.isFavorite = !h.isFavorite; toast("保存失败：" + err.message); }
    return;
  }
  if (act === "cmp") {
    if (e.target.checked) {
      if (compareSet.size >= 3) { e.target.checked = false; toast("最多对比 3 套"); return; }
      compareSet.add(id);
    } else compareSet.delete(id);
    updateCompareBar(); return;
  }
  openDetail(id);
});
function updateCompareBar(){
  const bar = $("#compare-bar");
  if (compareSet.size) {
    bar.classList.remove("hidden");
    $("#compare-text").textContent = `已选 ${compareSet.size} 套：` + [...compareSet].map(id => byId(id)?.community || id).join("、");

$("#btn-compare-go").addEventListener("click", () => {

document.querySelectorAll("[data-close-cmp]").forEach(el => el.addEventListener("click", closeCompare));

/* ==================== 详情抽屉 ==================== */
function kv(k, v, linkifyIt){
  if (!isSet(v)) return "";
  return `<div class="kv"><div class="k">${esc(k)}</div><div class="v">${linkifyIt ? linkify(v) : esc(v)}</div></div>`;
}
function amenBlock(title, arr){
  if (!arr || !arr.length) return "";
  const rows = arr.map(a => `<div class="amen">${esc(a.name||"")} <span class="d">${isSet(a.distanceKm)?a.distanceKm+" km":""}${a.note?" · "+esc(a.note):""}</span></div>`).join("");
  return `<section class="dsec"><h4>${esc(title)}</h4>${rows}</section>`;
}
function commuteLine(label, km, min){
  if (!isSet(km) && !isSet(min)) return "";
  const parts = [];
  if (isSet(km)) parts.push(km+" km");
  if (isSet(min)) parts.push("约"+min+" 分钟");
  return kv(label, parts.join(" · "));
}
function detailHTML(h){
  const name = h.community || "（未命名）";
  let html = `<div class="drawer-band g${gradIdx(h.community)}">
      <span class="band-char">${esc(name.trim().charAt(0) || "房")}</span>
      <button class="drawer-close" id="drawer-close">✕</button>
    </div>
    <div class="drawer-head">
      <h2>${esc(name)}</h2>
      <div class="meta-line">
        <span class="pill ${h.status==="viewed"?"viewed":""}">${h.status==="viewed"?"已看":"待看"}</span>
        ${[h.city, h.district, h.sector].filter(isSet).length ? `<span>${esc([h.city, h.district, h.sector].filter(isSet).join(" › "))}</span>` : ""}
        ${h.rating ? `<span class="stars">${starsStr(h.rating)}</span><span>评分 ${h.rating}/5</span>` : ""}
        ${h.viewingDate ? `<span>看房 ${esc(h.viewingDate)}</span>` : ""}
      </div>
    </div>
    <div class="drawer-body">`;
  let s = "";
  s += kv("单价", priceStr(h));
  if (isSet(h.histPriceMin) || isSet(h.histPriceMax)) s += kv("历史成交价", `${fmtNum(h.histPriceMin)}–${fmtNum(h.histPriceMax)} 元/㎡`);
  s += kv("总价备注", h.totalPriceNote);
  s += kv("租售比", h.rentSaleRatio);
  s += kv("成交量", h.transactionVolume);
  if (s) html += `<section class="dsec"><h4>价格</h4>${s}</section>`;
  s = "";
  s += kv("户型", h.layout);
  s += kv("面积", isSet(h.areaSqm) ? h.areaSqm+" ㎡" : "");
  s += kv("电梯", triStr(h.hasElevator));
  s += kv("总楼层", isSet(h.totalFloors) ? h.totalFloors+" 层" : "");
  s += kv("建成年", h.builtYear);
  s += kv("梯户比", h.elevatorRatio);
  s += kv("容积率/密度", h.density);
  s += kv("绿化", h.greenery);
  s += kv("物业公司", h.propertyCompany);
  s += kv("物业费", h.propertyFee);
  s += kv("产业园", h.industrialPark);
  if (s) html += `<section class="dsec"><h4>房屋与小区</h4>${s}</section>`;
  s = "";
  s += kv("地铁距离", isSet(h.subwayKm) ? h.subwayKm+" km" : "");
  s += kv("公交距离", isSet(h.busKm) ? h.busKm+" km" : "");
  s += commuteLine(h.commuteALabel || "通勤A", h.commuteAKm, h.commuteAMinutes);
  s += commuteLine(h.commuteBLabel || "通勤B", h.commuteBKm, h.commuteBMinutes);
  if (s) html += `<section class="dsec"><h4>交通通勤</h4>${s}</section>`;
  if (h.city === "天津" || isSet(h.driveAKm) || isSet(h.hsrStationName) || isSet(h.hsrRideMinutes)) {
    s = "";
    s += commuteLine("驾车到通勤A", h.driveAKm, h.driveAMinutes);
    s += commuteLine("驾车到通勤B", h.driveBKm, h.driveBMinutes);
    if (s) html += `<section class="dsec"><h4>天津 · 驾车通勤</h4>${s}</section>`;
    s = "";
    s += kv("最近高铁站", h.hsrStationName);
    s += commuteLine("到高铁站", h.hsrStationKm, h.hsrStationMinutes);
    s += kv("高铁到北京南站", isSet(h.hsrRideMinutes) ? "约"+h.hsrRideMinutes+" 分钟" : "");
    const leg = (toMin) => {
      const parts = [h.hsrStationMinutes, h.hsrRideMinutes, toMin].filter(isSet);
      return parts.length === 3 ? "约"+parts.reduce((a,b)=>a+Number(b),0)+" 分钟（三段合计）" : "";
    };
    s += kv("北京南站→通勤A", isSet(h.hsrToAMinutes) ? "约"+h.hsrToAMinutes+" 分钟" : "");
    s += kv("高铁全程→通勤A", leg(h.hsrToAMinutes));
    s += kv("北京南站→通勤B", isSet(h.hsrToBMinutes) ? "约"+h.hsrToBMinutes+" 分钟" : "");
    s += kv("高铁全程→通勤B", leg(h.hsrToBMinutes));
    if (s) html += `<section class="dsec"><h4>天津 · 高铁+地铁通勤</h4>${s}</section>`;
  }
  html += amenBlock("医院", h.hospitals);
  html += amenBlock("学校", h.schools);
  html += amenBlock("菜市场", h.markets);
  html += amenBlock("商场", h.malls);
  html += amenBlock("公园", h.parks);
  if (isSet(h.otherAmenities)) html += `<section class="dsec"><h4>其他配套</h4>${kv("说明", h.otherAmenities)}</section>`;
  s = "";
  s += kv("门禁", triStr(h.hasAccessControl));
  s += kv("车位", triStr(h.hasParking));
  s += kv("车位价格", h.parkingPrice);
  s += kv("是否临街", triStr(h.isStreetFacing));
  s += kv("附近电厂", triStr(h.hasPowerPlant));
  s += kv("附近垃圾站", triStr(h.hasGarbageStation));
  s += kv("附近高架", triStr(h.nearElevated));
  s += kv("噪音", h.noiseLevel);
  if (s) html += `<section class="dsec"><h4>环境与设施</h4>${s}</section>`;
  s = "";
  s += kv("看房时间", h.viewingDate);
  s += kv("看房体验", h.viewingExperience);
  s += kv("优点", h.pros);
  s += kv("缺点", h.cons);
  if (s) html += `<section class="dsec"><h4>看房记录</h4>${s}</section>`;
  s = "";
  s += kv("中介", h.agentName);
  s += kv("电话", h.agentPhone);
  s += kv("公司", h.agentCompany);
  s += kv("备注", h.agentNote);
  if (s) html += `<section class="dsec"><h4>中介</h4>${s}</section>`;
  if (isSet(h.notes)) html += `<section class="dsec"><h4>备注</h4><div class="notes-txt">${linkify(h.notes)}</div></section>`;
  html += `</div>`;
  return html;
}

const CMP_FIELDS = [
  ["状态", h => h.status==="viewed"?"已看":"待看"],
  ["位置", h => [h.city,h.district,h.sector].filter(isSet).join(" · ")],
  ["评分", h => h.rating ? h.rating+"/5" : ""],
  ["单价", h => priceStr(h)],
  ["历史成交价", h => (isSet(h.histPriceMin)||isSet(h.histPriceMax)) ? fmtNum(h.histPriceMin)+"–"+fmtNum(h.histPriceMax) : ""],
  ["总价备注", h => h.totalPriceNote||""],
  ["户型", h => h.layout||""],
  ["面积", h => isSet(h.areaSqm)?h.areaSqm+" ㎡":""],
  ["电梯", h => triStr(h.hasElevator)],
  ["总楼层", h => isSet(h.totalFloors)?h.totalFloors+"":""],
  ["建成年", h => h.builtYear||""],
  ["梯户比", h => h.elevatorRatio||""],
  ["地铁", h => isSet(h.subwayKm)?h.subwayKm+" km":""],
  ["通勤A", h => isSet(h.commuteAMinutes)?h.commuteAMinutes+" 分钟":""],
  ["通勤B", h => isSet(h.commuteBMinutes)?h.commuteBMinutes+" 分钟":""],
  ["租售比", h => h.rentSaleRatio||""],
  ["成交量", h => h.transactionVolume||""],
  ["物业公司", h => h.propertyCompany||""],
  ["物业费", h => h.propertyFee||""],
  ["车位", h => triStr(h.hasParking)],
  ["密度", h => h.density||""],
  ["绿化", h => h.greenery||""],
  ["优点", h => h.pros||""],
  ["缺点", h => h.cons||""]
];
function renderCompare(){
  const list = [...compareSet].map(byId).filter(Boolean);
  const prices = list.map(h => h.unitPriceMin).filter(isSet).map(Number);
  const best = prices.length ? Math.min(...prices) : null;
  let html = "<thead><tr><th></th>" + list.map(h=>`<th>${esc(h.community||"")}</th>`).join("") + "</tr></thead><tbody>";
  for (const [label, fn] of CMP_FIELDS) {
    html += `<tr><td class="k">${esc(label)}</td>` + list.map(h => {
      const isBest = label === "单价" && best !== null && isSet(h.unitPriceMin) && Number(h.unitPriceMin) === best;
      return `<td class="${isBest?"best":""}">${esc(fn(h))}</td>`;
    }).join("") + "</tr>";
  }
  html += "</tbody>";
  $("#cmp-table").innerHTML = html;
}

function triSel(val){ return (val===1||val===true) ? "1" : ((val===0||val===false) ? "0" : ""); }
function fieldInput(key, label, type, val){
  if (type === "status")
    return `<div class="fld"><label>${label}</label><select id="ef-${key}">
      <option value="viewed" ${val==="viewed"?"selected":""}>已看</option>
      <option value="planned" ${val==="planned"?"selected":""}>待看</option></select></div>`;
  if (type === "tri") {
    const sel = triSel(val);
    return `<div class="fld"><label>${label}</label><select id="ef-${key}">
      <option value="" ${sel===""?"selected":""}>未知</option>
      <option value="1" ${sel==="1"?"selected":""}>有</option>
      <option value="0" ${sel==="0"?"selected":""}>无</option></select></div>`;
  }
  if (type === "area")
    return `<div class="fld full"><label>${label}</label><textarea id="ef-${key}">${esc(val)}</textarea></div>`;
  return `<div class="fld"><label>${label}</label><input id="ef-${key}" type="${type==="num"?"number":"text"}" step="any" value="${esc(val)}"></div>`;
}
function amenEditor(key, title, arr){
  const rows = (arr||[]).map(a => amenRow(a)).join("");
  return `<section class="fsec"><h4>${title}</h4><div id="amen-${key}">${rows}</div>
    <button type="button" class="btn small" data-add-amen="${key}">＋ 添加一行</button></section>`;
}
function amenRow(a){
  return `<div class="arr-row">
    <input data-af="name" placeholder="名称" value="${esc(a?.name||"")}">
    <input data-af="distanceKm" type="number" step="any" placeholder="km" value="${esc(a?.distanceKm ?? "")}">
    <input data-af="note" placeholder="备注" value="${esc(a?.note||"")}">
    <button type="button" class="arr-del">✕</button></div>`;
}

function readForm(){
  const old = editingId ? byId(editingId) : {};
  const rec = { ...old };
  rec.isFavorite = $("#ef-isFavorite").value === "1";
  const rateBtn = document.querySelector("#rate-pick button.on");
  rec.rating = rateBtn && Number(rateBtn.dataset.rate) > 0 ? Number(rateBtn.dataset.rate) : null;
  for (const [, fields] of FORM_SECTIONS) for (const [key, , type] of fields) {
    const el = $("#ef-"+key); if (!el) continue;
    if (type === "num") rec[key] = el.value === "" ? null : Number(el.value);
    else if (type === "tri") rec[key] = el.value === "" ? null : Number(el.value);
    else rec[key] = el.value.trim();
  }
  rec.otherAmenities = $("#ef-otherAmenities").value.trim();
  rec.notes = $("#ef-notes").value;
  for (const [key] of AMEN_FIELDS) {
    rec[key] = [...document.querySelectorAll(`#amen-${key} .arr-row`)].map(row => {
      const g = f => row.querySelector(`[data-af="${f}"]`).value.trim();
      const d = g("distanceKm");
      return { name: g("name"), distanceKm: d === "" ? null : Number(d), note: g("note") };
    }).filter(a => a.name || isSet(a.distanceKm) || a.note);
  }
  return rec;
}
$("#btn-save").addEventListener("click", async () => {
  const rec = readForm();
  if (!rec.community) { toast("小区名不能为空"); return; }
  $("#btn-save").disabled = true;
  try {
    if (editingId) {
      rec.id = editingId;
      await dbUpdate(rec);
      houses = houses.map(h => h.id === editingId ? rec : h);
      detailId = editingId;
      toast("已保存");
      closeEdit();
      openDetail(editingId);
      renderStats(); renderList();
    } else {
      rec.id = Date.now();
      rec.createdAt = new Date().toISOString();
      await dbInsert(rec);
      houses.push(rec);
      buildFilterOptions();
      toast("已新增");
      closeEdit();
      renderAll();
    }
  } catch(err) { toast("保存失败：" + err.message); }
  $("#btn-save").disabled = false;
});

/* ==================== 导入 houses.json ==================== */
function triggerImport(){ $("#import-file").click(); }
$("#btn-import").addEventListener("click", triggerImport);
$("#btn-m-import").addEventListener("click", triggerImport);
$("#import-file").addEventListener("change", async (e) => {
  const file = e.target.files[0]; e.target.value = "";
  if (!file) return;
  let arr;
  try { arr = JSON.parse(await file.text()); }
  catch { toast("文件不是合法 JSON"); return; }
  if (!Array.isArray(arr) || !arr.length || arr.some(r => !r || !isSet(r.id))) { toast("JSON 格式不对：应为带 id 的记录数组"); return; }
  const { data: existing, error } = await sb.from("houses").select("app_id");
  if (error) { toast("导入前查询失败：" + error.message); return; }
  const existIds = new Set((existing||[]).map(r => Number(r.app_id)));
  if (existIds.size > 0 && !confirm(`表中已有 ${existIds.size} 条数据。导入将按 id 合并：同 id 更新、新 id 新增（不会删除已有数据）。继续？`)) return;
  const toInsert = arr.filter(r => !existIds.has(Number(r.id)));
  const toUpdate = arr.filter(r => existIds.has(Number(r.id)));
  try {
    for (let i = 0; i < toInsert.length; i += 50) {
      const chunk = toInsert.slice(i, i+50).map(r => ({ data: r }));
      const { error: ie } = await sb.from("houses").insert(chunk);
      if (ie) throw ie;
    }
    for (const r of toUpdate) await dbUpdate(r);
    toast(`导入完成：新增 ${toInsert.length} 条，更新 ${toUpdate.length} 条`);
    loadHouses();
  } catch(err) { toast("导入失败：" + err.message); }
});

/* ==================== 全局按键 / 启动 ==================== */
document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (!$("#edit-wrap").classList.contains("hidden")) closeEdit();
  else if (!$("#cmp-wrap").classList.contains("hidden")) closeCompare();
  else if ($("#drawer").classList.contains("open")) closeDrawer();
  else closeSidebarMobile();
});
init();
</script>
